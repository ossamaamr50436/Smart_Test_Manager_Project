# ============================================================
# Nginx — خادم وسيط / موازن أحمال لمنصة إدارة الاختبارات
# الاستخدام: بيئة الإنتاج خلف تطبيق Next.js وخادم Express المصغر
#
# الميزات:
#   - توزيع الطلبات بين نسخ متعددة من Next.js
#   - تخزين مؤقت للأصول الثابتة (CSS/JS/صور)
#   - ضغط Gzip/Brotli
#   - إعادة توجيه HTTPS ورؤوس أمان (HSTS, CSP)
# ============================================================

# ضغط الاستجابات
gzip on;
gzip_types text/plain text/css application/json application/javascript
           application/xml image/svg+xml font/woff2 application/pdf;
gzip_min_length 1024;

# مجموعة upstream لتطبيقات Next.js (نسخ متعددة عند التوسع)
upstream nextjs_app {
    # الطلب الكمي (least_conn) أو الجولة (round-robin) حسب الحاجة
    least_conn;
    server 127.0.0.1:3000;   # النسخة الرئيسية من Next.js
    # server 127.0.0.1:3001; # نسخة ثانية (إذا تم التوسع)
    # server 127.0.0.1:3002; # نسخة ثالثة
    keepalive 32;
}

# خادم Express المصغر (المهام الخلفية والمراقبة)
upstream express_micro {
    server 127.0.0.1:4000;
    keepalive 16;
}

# إعادة توجيه كل حركة HTTP إلى HTTPS
server {
    listen 80;
    server_name exam.example.com;   # غيّرها لاسم نطاقك
    return 301 https://$host$request_uri;
}

# الخادم الرئيسي HTTPS
server {
    listen 443 ssl http2;
    server_name exam.example.com;

    # شهادات SSL (سيرتفوقي: Let's Encrypt / certbot)
    ssl_certificate     /etc/letsencrypt/live/exam.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exam.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # أبعاد رفع الملفات (للشهادة والشعار)
    client_max_body_size 15m;

    # رؤوس الأمان
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP يُدار من التطبيق نفسه (مع nonce ديناميكي) — لا تفرضه هنا حتى لا تتطابق القواعد

    # ----------------------------------------------------
    # الأصول الثابتة المُخزّنة مؤقتاً (Cache) مع ضغط Brotli
    # ----------------------------------------------------
    location /_next/static/ {
        alias /var/www/smart-test-manager/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Brotli إن كان مفعّلاً في الوحدات
        brotli on;
        brotli_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;
    }

    location /icons/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /manifest.json {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/manifest+json";
    }

    # ملفات الخدمة عامة (مثل SW لن يعمل التخزين المؤقت عليه حرفياً)
    location = /sw.js {
        alias /var/www/smart-test-manager/public/sw.js;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ----------------------------------------------------
    # توجيه طلبات الخدمة الدقيقة (Express) — المراقبة والطابور
    # ----------------------------------------------------
    location /api/micro/ {
        proxy_pass http://express_micro;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/queue/status {
        proxy_pass http://express_micro;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------
    # بقية الطلبات → Next.js
    # ----------------------------------------------------
    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # مهلة معقولة لطلبات الموازنة
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
